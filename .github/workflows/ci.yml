name: CI
# Manual only: Actions minutes are scarce. CI runs locally on the dev PC before every push
# (scripts\test\ci.bat: the hub tests with the real Umwelt pin, then this same ship dry run).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hub tests
        run: python tests/run_tests.py

  ship-dry-run:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # ship.ps1 fetches the public umwelt-engine pin (tools/umwelt_pin.json) with no token
      # and checks the commit after checkout. No UMWELT_SRC override, no deploy key.
      - name: Ship dry run
        shell: pwsh
        run: ./scripts/ship.ps1 -SkipPython -SkipZip
      - name: Check staged build
        shell: pwsh
        run: |
          $v = ((Get-Content -Raw VERSION).Trim() -split "[\r\n]+")[0].Trim()
          python tools/check_ship_dryrun_v1.py "export/dist/VerdanceAshes_v$v"
