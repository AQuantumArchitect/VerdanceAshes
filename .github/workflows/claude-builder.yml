name: Claude Builder
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  build:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'building') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-builder-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,MultiEdit,Bash"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }} — ${{ github.event.issue.title }}
            EXTRA INSTRUCTION FROM OWNER COMMENT (may be empty): ${{ github.event.comment.body }}

            You are the builder for Luke Spooner's projects. Read the issue (gh issue view ${{ github.event.issue.number }} --comments) and implement it fully to its "done when" criteria.
            Rules:
            - Work on a new branch named claude/issue-${{ github.event.issue.number }}, commit, push, and open EXACTLY ONE pull request with `gh pr create` whose body contains "Closes #${{ github.event.issue.number }}" and a short summary of what changed and how it was verified.
            - Run the repo's existing tests/linters where feasible before opening the PR.
            - Act as Luke's proxy for taste: keep the spirit and feel of the project, prefer small coherent changes over sprawl, no slop.
            - Never put secrets, tokens or credentials in code, commits, or PR/issue text.
            - Never invent numbers. Any metric you did not actually measure must be marked DARK.
            - Do not spend money, configure live payments or auth providers, publish or deploy, or send messages to real people. If the issue needs any of those, implement up to that point and flag it clearly in the PR body under "Needs Luke".
            - Stay in the issue's scope.
            - If you cannot finish, comment on the issue (gh issue comment) explaining exactly why and what is needed, and do not open a half-done PR unless it is clearly marked draft.
      - name: Log Claude usage
        if: always()
        continue-on-error: true
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          F="${EXEC_FILE:-$RUNNER_TEMP/claude-execution-output.json}"
          if [ -s "$F" ]; then
            jq -s 'if length==1 and (.[0]|type)=="array" then .[0] else . end' "$F" > /tmp/msgs.json 2>/dev/null || echo '[]' > /tmp/msgs.json
          else echo '[]' > /tmp/msgs.json; fi
          jq --arg outcome "$OUTCOME" --arg issue "$ISSUE" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$RUN_URL" --arg repo "$GITHUB_REPOSITORY" '
            (map(select(.type=="result"))|last) as $r
            | (map(select(.type=="system" and .subtype=="init"))|first) as $i
            | ($r.modelUsage // {}) as $mu
            | def musum(k): ([$mu[]|.[k]?|numbers]|if length>0 then add else null end);
            {schema:"claude-usage/1", repo:$repo,
             issue:($issue|tonumber? // null), run_id:($run_id|tonumber), run_url:$run_url,
             model:($i.model // null), outcome:(if $outcome=="" then null else $outcome end),
             result_subtype:($r.subtype // null),
             tokens_in:($r.usage.input_tokens // musum("inputTokens")),
             tokens_out:($r.usage.output_tokens // musum("outputTokens")),
             cache_read:($r.usage.cache_read_input_tokens // musum("cacheReadInputTokens")),
             cache_creation:($r.usage.cache_creation_input_tokens // musum("cacheCreationInputTokens")),
             turns:($r.num_turns // null), total_cost_usd:($r.total_cost_usd // null),
             duration_ms:($r.duration_ms // null)}' /tmp/msgs.json > usage.json 2>/dev/null \
            || jq -n --arg o "$OUTCOME" --arg i "$ISSUE" --arg r "$GITHUB_RUN_ID" --arg u "$RUN_URL" '{schema:"claude-usage/1",issue:($i|tonumber? // null),run_id:($r|tonumber),run_url:$u,outcome:$o,model:null,tokens_in:null,tokens_out:null,cache_read:null,cache_creation:null,turns:null,total_cost_usd:null,duration_ms:null}' > usage.json
          jq -r '"Claude usage: model=\(.model) in=\(.tokens_in) out=\(.tokens_out) cache_read=\(.cache_read) turns=\(.turns) cost_equiv_usd=\(.total_cost_usd) duration_ms=\(.duration_ms) outcome=\(.outcome)"' usage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload usage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage
          path: usage.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Mark blocked on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create blocked --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          gh issue edit ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --add-label blocked --remove-label building
          gh issue comment ${{ github.event.issue.number }} --repo "$GITHUB_REPOSITORY" --body "Claude Builder run failed or timed out: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — marked blocked."
